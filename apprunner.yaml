version: 1.0
runtime: nodejs18
build:
  commands:
    build:
      - npm install -g pnpm
      - corepack enable
      - pnpm install --prod --frozen-lockfile
      - pnpm deploy --filter=@imput/cobalt-api --prod /app/api
run:
  command: node src/cobalt
  network:
    port: 9000
    env: APP_PORT
  env:
    - name: API_URL
      value: "https://placeholder.com/"
