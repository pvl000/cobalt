version: 1.0
runtime: nodejs20
build:
  commands:
    build:
      - npm install -g pnpm
      - corepack enable
      - pnpm install --prod --frozen-lockfile
run:
  command: cd api && node src/cobalt.js
  network:
    port: 9000
    env: APP_PORT
  env:
    - name: API_URL
      value: "https://placeholder.com/"
